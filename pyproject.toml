[project]
name = "bias-aware-backtesting"
version = "0.4.0"
description = "Interactive framework showing how common data biases distort financial-signal backtests"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.28,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "plotly>=5.24,<7",
  "pyarrow>=18,<24",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.61,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.16,<2",
  "pandas-stubs>=2.2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]
reports = [
  "pillow>=11,<13",
  "python-docx>=1.2,<2",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001"]

[tool.mypy]
